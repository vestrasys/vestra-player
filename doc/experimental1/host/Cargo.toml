# 实验版本：接口和结构与最终成品 API 可能存在很大差异。
[package]
name = "vestra-slint-experimental1"
version = "0.0.0"
edition = "2024"
rust-version = "1.92"
publish = false

[dependencies]
slint = "=1.18.1"
slint-interpreter = "=1.18.1"
spin_on = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
# 仅实验窗口截图验证使用，不是插件 API。
image = { version = "0.25", default-features = false, features = ["png"] }

[workspace]
