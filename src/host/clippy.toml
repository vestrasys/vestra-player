# Windows: std's canonicalize returns `\\?\C:\…` verbatim paths, which Slint
# imports (and some tools) do not resolve. dunce returns the plain path when it
# names the same file, and is std's canonicalize elsewhere.
disallowed-methods = [
  { path = "std::fs::canonicalize", reason = "use dunce::canonicalize (no \\\\?\\ prefix on Windows)" },
  { path = "std::path::Path::canonicalize", reason = "use dunce::canonicalize (no \\\\?\\ prefix on Windows)" },
]
# A GUI-subsystem host's stderr is often a pipe whose reader may be gone, and
# the std print macros panic then (the release host aborts). Diagnostics use
# `diag!` (src/diag.rs), which drops a failed write; the host writes nothing
# to stdout.
disallowed-macros = [
  { path = "std::eprintln", reason = "use diag! (src/diag.rs): eprintln! panics on a closed stderr" },
  { path = "std::eprint", reason = "use diag! (src/diag.rs): eprint! panics on a closed stderr" },
  { path = "std::println", reason = "the host writes nothing to stdout; diagnostics use diag! (src/diag.rs)" },
  { path = "std::print", reason = "the host writes nothing to stdout; diagnostics use diag! (src/diag.rs)" },
]
