# Homebrew libmpv; other platforms should configure their own libmpv search path.
[target.aarch64-apple-darwin]
rustflags = ["-L", "native=/opt/homebrew/lib"]

# Windows (MSVC): the C runtime is linked in statically, so the player needs no
# VC++ redistributable (VCRUNTIME140.dll is not part of Windows). libmpv-2.dll
# (MinGW) uses the system UCRT on its own side; nothing allocated by one side
# is freed by the other (rsmpv frees mpv's memory with mpv_free).
# `RUSTFLAGS` in the environment replaces this list: CI and packaging do not
# set it. `platform/windows.rs` checks it reached the test build.
[target.'cfg(all(target_os = "windows", target_env = "msvc"))']
rustflags = ["-C", "target-feature=+crt-static"]
