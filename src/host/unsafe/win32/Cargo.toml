[package]
name = "vestra-win32"
version = "0.0.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false
description = "Win32 calls the host's Windows platform module needs (pointer, modifier keys, double-click time, sleep prevention)"

# One of the crates under src/host/unsafe/: the only place first-party Rust may
# use `unsafe`. Every block carries a SAFETY comment; the public API is safe.
# Empty on other systems.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Power", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
