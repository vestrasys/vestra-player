[package]
name = "vestra-gpu-render"
version = "0.0.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false
description = "libmpv OpenGL rendering shown in Slint windows (macOS; the host's GPU rendering)"

# One of the crates under src/host/unsafe/: the only place first-party Rust may
# use `unsafe`. Every block carries a SAFETY comment; the public API is safe.
[target.'cfg(target_os = "macos")'.dependencies]
glow = "=0.18.0"
libc = "0.2"
objc2-core-foundation = { version = "=0.3.2", default-features = false, features = ["std", "CFDictionary", "CFNumber", "CFString"] }
objc2-io-surface = { version = "=0.3.2", default-features = false, features = ["std", "IOSurfaceRef", "IOSurfaceTypes", "libc", "objc2-core-foundation"] }
rsmpv = { version = "=0.2.1", features = ["render"] }
slint = { version = "=1.18.1", default-features = false, features = ["std", "compat-1-2"] }

# Not `workspace = true` (that would forbid unsafe); src/scripts/check-unsafe-policy.mjs
# requires these entries.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"
dbg_macro = "warn"
todo = "warn"
