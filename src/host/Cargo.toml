[package]
name = "vestra-host"
version = "0.10.2"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
anyhow = "1"
pollster = "0.4"
png = "0.18"
# Runtime images (`plugin.ui.image`): PNG and JPEG; snapshot export also writes
# JPEG and BMP (`Snapshot.export`). Already in the tree via Slint.
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "bmp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rsmpv = { version = "=0.2.1", features = ["render", "stream-cb"] }
# No accessibility tree (developer ruling 2026-11-07): Slint's default features
# minus `accessibility`, so AccessKit is not built in. Slint 1.18 rebuilds the
# whole AccessKit tree whenever an element is created or destroyed (120–160 ms
# per menu hover on a 4K render target); the player does not offer screen-reader
# support. The list is Slint 1.18.1's `default` without `accessibility`: recheck
# it on every Slint upgrade, here, in slint-interpreter below and in the
# Windows entry further down (every entry of a crate must say
# `default-features = false`, or Cargo turns the defaults back on).
# `unstable-fontique-011`: `slint::fontique_011::shared_collection()`, the
# per-script CJK fallback chains of `ui_fonts.rs`.
slint = { version = "=1.18.1", default-features = false, features = ["std", "backend-default", "renderer-femtovg", "renderer-software", "compat-1-2", "system-tray", "unstable-winit-030", "unstable-fontique-011"] }
# `internal`: `ComponentDefinition::create_with_existing_window`, so that a new
# main-window composition replaces the component tree inside the same native
# window, as Slint's live preview does (`ui::composition::compile_json_in`).
# Not covered by semver: recheck on every Slint upgrade (the version is pinned).
# The other features are slint-interpreter 1.18.1's `default` without
# `accessibility` (see `slint` above).
slint-interpreter = { version = "=1.18.1", default-features = false, features = ["backend-default", "renderer-femtovg", "renderer-software", "compat-1-2", "system-tray", "internal"] }
# Per-panel compilation (ui/panels.rs): only to name `i_slint_core::InternalToken`
# (`Compiler::compiler_configuration`, which enables Slint's experimental
# `ComponentContainer` for the shell's own source, never for plugin files;
# `CompilationResult::watch_paths`) and `component_factory::FactoryContext`.
# Same pin as slint-interpreter: recheck on every Slint upgrade.
i-slint-core = { version = "=1.18.1", default-features = false }
rfd = "0.17.2"
base64 = "=0.22.1"
sha2 = "=0.10.9"
url = "=2.5.8"
subtp = "=0.2.0"
tempfile = "=3.27.0"
# Installation instances (store proposal §1): GUID v4.
uuid = { version = "=1.28.0", default-features = false, features = ["v4", "std"] }
# `.vxp` plugin packages (zip): stored and deflate only, no encryption.
zip = { version = "=9.0.5", default-features = false, features = ["deflate-flate2"] }
# `plugin.ui.markdown`: CommonMark + GFM tables (already in the tree via Slint).
pulldown-cmark = { version = "=0.13.6", default-features = false }
# Cmap check of the bundled subtitle font (font_asset.rs); the same version
# Slint already uses (ttf-parser is unmaintained, RUSTSEC-2026-0192).
skrifa = { version = "=0.44.0", default-features = false, features = ["std"] }
# Canonical paths without the Windows `\\?\` verbatim prefix where an
# ordinary path means the same file (Slint imports, mpv, FFmpeg); same as std
# elsewhere. `clippy.toml` disallows std's canonicalize.
dunce = "=1.0.5"
# Interface language (doc/architecture/i18n.md): the system's preferred
# languages (platform::preferred_languages), already in the tree via Slint.
sys-locale = "=0.3.2"
# Menu width estimate (menu.rs): East Asian Width, already in the tree.
unicode-width = { version = "=0.2.2", default-features = false }
cpal = { version = "=0.18.2", optional = true }
# Software rendering: video pictures shown through one reused OpenGL texture
# (frames are not re-uploaded as new images); the `unsafe` stays in unsafe/texture.
vestra-video-texture = { path = "unsafe/texture" }
rtrb = { version = "=0.4.0", optional = true }

# The unsafe/ crates share this lock file; `cargo test` here still runs only the host.
[workspace]
members = ["unsafe/open", "unsafe/pip", "unsafe/render", "unsafe/texture", "unsafe/win32"]

# Lints for every first-party crate outside src/host/unsafe/ (`[lints] workspace = true`).
# The unsafe/ crates do not inherit these: Cargo cannot override single lints of an
# inherited set, so each writes its own full `[lints]` (src/scripts/check-unsafe-policy.mjs
# checks both).
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[features]
default = ["producer-audio"]
producer-audio = ["dep:cpal", "dep:rtrb"]

[lints]
workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.5"
block2 = "=0.6.2"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "block2", "NSApplication", "NSWindow", "NSResponder", "NSScreen", "NSPasteboard", "NSAlert", "NSButton", "NSControl", "NSView", "NSCell", "NSEvent", "NSAppearance", "NSWorkspace", "NSAccessibility"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSString", "NSData", "NSGeometry", "NSProcessInfo"] }
# `plugin.secrets`: generic passwords in the login keychain.
keyring = { version = "=3.6.3", features = ["apple-native"] }
# GPU rendering (SDK site, Concepts: render options): libmpv draws with OpenGL into IOSurfaces
# that Slint's femtovg renderer shows; the `unsafe` stays in unsafe/render.
vestra-gpu-render = { path = "unsafe/render" }
# Picture-in-picture (window.setPictureInPicture): AVKit, the unsafe part in unsafe/pip.
vestra-pip = { path = "unsafe/pip" }
# Finder "Open With" and double-click: open-documents Apple events (unsafe/open).
vestra-open-files = { path = "unsafe/open" }

# The Windows platform module (src/platform/windows.rs). Safe crates first;
# the few Win32 calls none of them wraps are in unsafe/win32.
[target.'cfg(windows)'.dependencies]
arboard = { version = "=3.7.0", default-features = false, features = ["image-data"] }
keyring = { version = "=3.6.3", features = ["windows-native"] }
opener = { version = "=0.9.0", features = ["reveal"] }
windows-registry = "0.6"
# Confirmation buttons with the plugin's own labels (TaskDialogIndirect, needs
# Common Controls v6: build.rs embeds the application manifest).
rfd = { version = "0.17.2", features = ["common-controls-v6"] }
# The loopback stream transport's token (platform/mod.rs `av_tcp`).
getrandom = "=0.3.4"
vestra-win32 = { path = "unsafe/win32" }
# Every window draws with Slint's femtovg renderer on wgpu (Direct3D 12) and
# libmpv's Direct3D 11 frames are shown from textures shared with that device
# (doc/architecture/README.md §4.3); the `unsafe` stays in
# unsafe/render. Windows only: macOS keeps femtovg on OpenGL. `femtovg` (GL)
# and the software renderer stay as the fallbacks (platform/windows.rs).
slint = { version = "=1.18.1", default-features = false, features = ["renderer-femtovg-wgpu", "unstable-wgpu-30"] }
vestra-gpu-render = { path = "unsafe/render" }
# File identity (volume serial + file index) of the handle libmpv reads a leased
# local file through (source_lease.rs `matches_file`, lease_stream.rs).
same-file = "=1.0.6"

# Tests only: a GPU renderer on WARP (video_render.rs, the broken-shader test).
[target.'cfg(windows)'.dev-dependencies]
vestra-gpu-render = { path = "unsafe/render", features = ["test-support"] }

# ICU4X prints every data-fallback warning with eprintln! when debug_assertions are on.
# Parley segments CJK text without the optional CJ dictionary on each layout (line
# breaking still follows UAX #14), which floods stderr in dev builds. Release
# builds already compile these warnings out.
[profile.dev.package.icu_provider]
debug-assertions = false

# Packaged builds (packaging proposal §3.1): no symbol tables in the shipped
# executable (47 → 41.5 MB on macOS); panics still name their location.
[profile.release]
strip = "symbols"
