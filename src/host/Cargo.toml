[package]
name = "vestra-host"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
anyhow = "1"
pollster = "0.4"
png = "0.18"
# Runtime images (`plugin.ui.image`): PNG and JPEG only; already in the tree via Slint.
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rsmpv = { version = "=0.2.1", features = ["render"] }
slint = { version = "=1.16.1", features = ["unstable-winit-030"] }
slint-interpreter = "=1.16.1"
rfd = "0.17.2"
base64 = "=0.22.1"
sha2 = "=0.10.9"
url = "=2.5.8"
subtp = "=0.2.0"
tempfile = "=3.27.0"
ttf-parser = "=0.25.1"
cpal = { version = "=0.18.2", optional = true }
rtrb = { version = "=0.4.0", optional = true }

[features]
default = ["producer-audio"]
producer-audio = ["dep:cpal", "dep:rtrb"]

[lints.rust]
unsafe_code = "forbid"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.5"
block2 = "=0.6.2"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "block2", "NSApplication", "NSWindow", "NSResponder", "NSScreen", "NSPasteboard", "NSAlert", "NSButton", "NSControl", "NSView", "NSCell", "NSEvent"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSString", "NSData", "NSGeometry"] }

# ICU4X prints every data-fallback warning with eprintln! when debug_assertions are on.
# Parley segments CJK text without the optional CJ dictionary on each layout (line
# breaking still follows UAX #14), which floods stderr in dev builds. Release
# builds already compile these warnings out.
[profile.dev.package.icu_provider]
debug-assertions = false
