[package]
name = "vestra-host"
version = "0.2.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
anyhow = "1"
pollster = "0.4"
png = "0.18"
# Runtime images (`plugin.ui.image`): PNG and JPEG; snapshot export also writes
# JPEG and BMP (`Snapshot.export`). Already in the tree via Slint.
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "bmp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rsmpv = { version = "=0.2.1", features = ["render"] }
slint = { version = "=1.18.1", features = ["unstable-winit-030"] }
slint-interpreter = "=1.18.1"
rfd = "0.17.2"
base64 = "=0.22.1"
sha2 = "=0.10.9"
url = "=2.5.8"
subtp = "=0.2.0"
tempfile = "=3.27.0"
# Installation instances (store proposal §1): GUID v4.
uuid = { version = "=1.28.0", default-features = false, features = ["v4", "std"] }
# `.vxp` plugin packages (zip): stored and deflate only, no encryption.
zip = { version = "=9.0.5", default-features = false, features = ["deflate-flate2"] }
# `plugin.ui.markdown`: CommonMark + GFM tables (already in the tree via Slint).
pulldown-cmark = { version = "=0.13.4", default-features = false }
# Cmap check of the bundled subtitle font (font_asset.rs); the same version
# Slint already uses (ttf-parser is unmaintained, RUSTSEC-2026-0192).
skrifa = { version = "=0.44.0", default-features = false, features = ["std"] }
# Canonical paths without the Windows `\\?\` verbatim prefix where an
# ordinary path means the same file (Slint imports, mpv, FFmpeg); same as std
# elsewhere. `clippy.toml` disallows std's canonicalize.
dunce = "=1.0.5"
cpal = { version = "=0.18.2", optional = true }
rtrb = { version = "=0.4.0", optional = true }

# The unsafe/ crates share this lock file; `cargo test` here still runs only the host.
[workspace]
members = ["unsafe/pip", "unsafe/render", "unsafe/win32"]

# Lints for every first-party crate outside src/host/unsafe/ (`[lints] workspace = true`).
# The unsafe/ crates do not inherit these: Cargo cannot override single lints of an
# inherited set, so each writes its own full `[lints]` (src/scripts/check-unsafe-policy.mjs
# checks both).
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[features]
default = ["producer-audio"]
producer-audio = ["dep:cpal", "dep:rtrb"]

[lints]
workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.5"
block2 = "=0.6.2"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "block2", "NSApplication", "NSWindow", "NSResponder", "NSScreen", "NSPasteboard", "NSAlert", "NSButton", "NSControl", "NSView", "NSCell", "NSEvent"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSString", "NSData", "NSGeometry", "NSProcessInfo"] }
# `plugin.secrets`: generic passwords in the login keychain.
keyring = { version = "=3.6.3", features = ["apple-native"] }
# GPU rendering (reference §5.4): libmpv draws with OpenGL into IOSurfaces
# that Slint's femtovg renderer shows; the `unsafe` stays in unsafe/render.
vestra-gpu-render = { path = "unsafe/render" }
# Picture-in-picture (window.setPictureInPicture): AVKit, the unsafe part in unsafe/pip.
vestra-pip = { path = "unsafe/pip" }

# The Windows platform module (src/platform/windows.rs). Safe crates first;
# the few Win32 calls none of them wraps are in unsafe/win32.
[target.'cfg(windows)'.dependencies]
arboard = { version = "=3.7.0", default-features = false, features = ["image-data"] }
keyring = { version = "=3.6.3", features = ["windows-native"] }
opener = { version = "=0.9.0", features = ["reveal"] }
windows-registry = "0.6"
# Confirmation buttons with the plugin's own labels (TaskDialogIndirect, needs
# Common Controls v6: build.rs embeds the application manifest).
rfd = { version = "0.17.2", features = ["common-controls-v6"] }
# The loopback stream transport's token (platform/mod.rs `av_tcp`).
getrandom = "=0.3.4"
vestra-win32 = { path = "unsafe/win32" }

# ICU4X prints every data-fallback warning with eprintln! when debug_assertions are on.
# Parley segments CJK text without the optional CJ dictionary on each layout (line
# breaking still follows UAX #14), which floods stderr in dev builds. Release
# builds already compile these warnings out.
[profile.dev.package.icu_provider]
debug-assertions = false
