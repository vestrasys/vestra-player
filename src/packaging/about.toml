# cargo-about: the licenses of the Rust crates in a package
# (licenses/rust-crates.html). Run by the packaging scripts:
#   cargo about generate --manifest-path src/host/Cargo.toml \
#     -c src/packaging/about.toml --target <triple> src/packaging/about.hbs
# `accepted` must equal src/host/deny.toml [licenses].allow
# (check-licenses.mjs --static fails otherwise).
accepted = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "MPL-2.0",
  "BSL-1.0",
  "CC0-1.0",
  "0BSD",
  "LGPL-2.1-or-later",
  "LGPL-3.0-or-later",
  "GPL-3.0-or-later",
  "GPL-3.0-only",
  "OFL-1.1",
  "Unlicense",
]
targets = ["aarch64-apple-darwin", "x86_64-pc-windows-msvc"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
