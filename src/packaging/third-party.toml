# What a package ships that is not Rust code from Cargo (cargo-about covers
# that: licenses/rust-crates.html). check-licenses.mjs --bundle enforces:
#   - every file in the package matches [own] or a component's files;
#   - every component's license_files exist under the package's licenses/
#     directory (macOS Contents/Resources/licenses, Windows <install>\licenses);
#   - every plugin package (.vxp) named by a component holds its vxp_license_files;
#   - every license expression is satisfied by [policy].allowed.
# Paths in `macos`/`windows` are globs relative to Vestra Player.app/Contents
# and to the install directory. `license_from` gives, in the same order as
# `license_files`, the repository file the bundler copies (src/-relative);
# without it the bundler produces the file itself.
#
# The libmpv/FFmpeg closure is not listed here: each deps archive carries a
# generated components.json (deps.yml), shipped as
# licenses/third-party/deps/components.json and read the same way.

[policy]
# GPLv3-compatible licenses (the package as a whole is GPL-3.0-or-later):
# src/host/deny.toml's list plus what the C libraries use. In an expression,
# OR needs one allowed side, AND needs all.
allowed = [
  "MIT", "MIT-0", "Apache-2.0", "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause", "BSD-3-Clause", "BSD-2-Clause-Patent", "ISC", "Zlib",
  "Unicode-3.0", "MPL-2.0", "BSL-1.0", "CC0-1.0", "0BSD", "Unlicense",
  "OFL-1.1", "LGPL-2.0-or-later", "LGPL-2.1-only", "LGPL-2.1-or-later",
  "LGPL-3.0-or-later", "GPL-2.0-or-later", "GPL-3.0-only", "GPL-3.0-or-later",
  "FTL", "IJG", "libpng-2.0", "WTFPL", "HPND-sell-variant", "MIT-Modern-Variant",
  "LicenseRef-Homebrew-public-domain", "curl", "X11", "bzip2-1.0.6",
]

[own]
macos = [
  "Info.plist",
  "PkgInfo",
  "_CodeSignature/**",
  "MacOS/vestra-host",
  "Resources/AppIcon.icns",
  "Resources/ui/**",
  "Resources/runtime/runner.ts",
  "Resources/runtime/package.json",
  "Resources/plugins/**",
  "Resources/licenses/**",
]
windows = [
  "vestra-host.exe",
  "resources/ui/**",
  "resources/runtime/runner.ts",
  "resources/runtime/package.json",
  "resources/plugins/**",
  "licenses/**",
]

[[component]]
name = "Vestra Player"
license = "GPL-3.0-or-later"
license_files = ["LICENSE"]
license_from = ["../LICENSE"]
source = "https://github.com/vestrasys/vestra-player"

[[component]]
name = "Rust crates (cargo-about)"
license = "GPL-3.0-or-later"
license_files = ["rust-crates.html"]
note = "Linked into vestra-host; every crate's license is in rust-crates.html."

[[component]]
name = "Node.js"
version = "node.json"
license = "MIT"
macos = ["MacOS/node"]
windows = ["node/node.exe"]
license_files = ["third-party/node/LICENSE"]
note = "Official nodejs.org binary; its LICENSE includes the licenses of V8, OpenSSL, ICU and the other bundled libraries."
source = "https://nodejs.org/dist/"

[[component]]
name = "libmpv, FFmpeg and their libraries"
deps = true
macos = ["Frameworks/*.dylib", "MacOS/ffmpeg", "MacOS/ffprobe"]
windows = ["libmpv-2.dll", "vulkan-1.dll", "ffmpeg/*"]
license_files = ["third-party/deps/components.json"]
note = "Per-library versions, licenses and sources: third-party/deps/components.json."

[[component]]
name = "@vestra-player/sdk (plugin runtime)"
license = "Apache-2.0"
macos = ["Resources/runtime/node_modules/**"]
windows = ["resources/runtime/node_modules/**"]
license_files = ["third-party/vestra-player-sdk/LICENSE"]
source = "https://github.com/vestrasys/vestra-player-sdk"

[[component]]
name = "Noto Sans CJK SC"
license = "OFL-1.1"
license_files = ["third-party/noto-sans-cjk/LICENSE"]
license_from = ["assets/fonts/noto-cjk/LICENSE"]
note = "Subtitle font, embedded in vestra-host."
source = "https://github.com/notofonts/noto-cjk/tree/f8d157532fbfaeda587e826d4cd5b21a49186f7c"

[[component]]
name = "JSNES 2.1.0 (in the NES plugin)"
license = "Apache-2.0"
vxp = "vestra.nes"
vxp_license_files = ["licenses/jsnes-LICENSE"]
license_files = ["third-party/jsnes/LICENSE"]
license_from = ["plugins/nes/licenses/jsnes-LICENSE"]
source = "https://github.com/bfirsh/jsnes"

[[component]]
name = "pi-ai, pi-agent-core, typebox, partial-json (in the workshop plugin)"
license = "MIT"
vxp = "vestra.workshop"
vxp_license_files = [
  "licenses/@earendil-works__pi-ai/LICENSE",
  "licenses/@earendil-works__pi-agent-core/LICENSE",
  "licenses/typebox/license",
  "licenses/partial-json/LICENSE",
]
note = "Versions and license notes: dependency-inventory.json in the plugin package."

[[component]]
name = "TypeScript, @types/node, undici-types (in the workshop plugin)"
license = "Apache-2.0 AND MIT"
vxp = "vestra.workshop"
vxp_license_files = [
  "vendor/typescript/LICENSE.txt",
  "vendor/@types/node/LICENSE",
  "vendor/undici-types/LICENSE",
]
