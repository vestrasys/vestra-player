name: Set up Rust
description: >
  Installs the toolchain pinned in rust-toolchain.toml and restores the cargo
  cache for src/host. Only main writes the cache (feature branches read main's).
inputs:
  cache:
    description: Restore (and on main, save) the cargo cache.
    default: "true"
  cache-key:
    description: Extra cache key, e.g. the job kind (build-test, package).
    default: ""
  save:
    description: >
      On main, save the cache. A job that builds only part of the workspace
      (build-test `ui-only`) restores the full one and must not replace it.
    default: "true"
runs:
  using: composite
  steps:
    - name: Install the pinned toolchain
      shell: bash
      run: |
        rustup set auto-self-update disable
        rustup toolchain install
        rustup show active-toolchain
        rustc --version
        cargo --version
    - name: Cargo cache
      if: inputs.cache == 'true'
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        workspaces: src/host -> target
        key: ${{ inputs.cache-key }}
        save-if: ${{ github.ref == 'refs/heads/main' && inputs.save == 'true' }}
