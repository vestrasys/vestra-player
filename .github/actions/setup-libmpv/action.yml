name: Set up libmpv
description: >
  The pinned dependency archive from this repository's `deps-*` release
  (src/packaging/deps.json, built by deps.yml): macOS the Homebrew libmpv +
  FFmpeg closure with @rpath install names, Windows libmpv-2.dll (our build, src/packaging/libmpv)
  with its MSVC import library mpv.lib and BtbN ffmpeg/ffprobe. Downloaded
  with the job token, checked against the SHA-256 in deps.json, cached.
  Sets MPV_LIBRARY_DIR (rsmpv-sys build.rs) and VESTRA_DEPS_DIR (the
  packaging scripts); macOS adds an rpath to the deps so test binaries load
  libmpv, Windows puts the DLL directory on PATH.
runs:
  using: composite
  steps:
    - name: Read the pin
      id: pin
      shell: bash
      env:
        KEY: ${{ runner.os == 'Windows' && 'windows-x64' || 'macos-arm64' }}
      run: |
        pins=src/packaging/deps.json
        tag=$(jq -r '.release // empty' "$pins")
        repo=$(jq -r '.repository' "$pins")
        file=$(jq -r --arg key "$KEY" '.assets[$key].file // empty' "$pins")
        sha=$(jq -r --arg key "$KEY" '.assets[$key].sha256 // empty' "$pins")
        if [ -z "$tag" ] || [ -z "$file" ] || [ -z "$sha" ]; then
          echo "::error::src/packaging/deps.json has no $KEY asset; run the deps workflow and commit its deps.json"
          exit 1
        fi
        {
          echo "tag=$tag"
          echo "repo=$repo"
          echo "file=$file"
          echo "sha=$sha"
        } >> "$GITHUB_OUTPUT"

    - name: Dependency archive cache
      id: cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/vestra-deps-archive
        key: vestra-deps-${{ steps.pin.outputs.sha }}

    - name: Download, verify and unpack
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ steps.pin.outputs.tag }}
        REPO: ${{ steps.pin.outputs.repo }}
        FILE: ${{ steps.pin.outputs.file }}
        SHA: ${{ steps.pin.outputs.sha }}
        CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
      # The values written are runner paths, not event data.
      run: | # zizmor: ignore[github-env]
        archive_dir="$RUNNER_TEMP/vestra-deps-archive"
        deps="$RUNNER_TEMP/vestra-deps"
        mkdir -p "$archive_dir" "$deps"
        if [ "$CACHE_HIT" != true ]; then
          gh release download "$TAG" --repo "$REPO" --pattern "$FILE" --dir "$archive_dir" --clobber
        fi
        # Hash stdin: Git Bash's sha256sum escapes a Windows path in its output.
        if command -v sha256sum > /dev/null; then
          actual=$(sha256sum < "$archive_dir/$FILE" | cut -d' ' -f1)
        else
          actual=$(shasum -a 256 < "$archive_dir/$FILE" | cut -d' ' -f1)
        fi
        if [ "$actual" != "$SHA" ]; then
          echo "::error::$FILE SHA-256 mismatch: $actual, deps.json pins $SHA"
          exit 1
        fi
        case "$FILE" in
          *.tar.xz) tar -xJf "$archive_dir/$FILE" -C "$deps" ;;
          *.zip) 7z x -y "-o$deps" "$archive_dir/$FILE" > /dev/null ;;
          *) echo "::error::unknown archive type $FILE"; exit 1 ;;
        esac
        if [ "$RUNNER_OS" = Windows ]; then
          deps_native=$(cygpath -w "$deps")
          echo "MPV_LIBRARY_DIR=$deps_native" >> "$GITHUB_ENV"
          echo "VESTRA_DEPS_DIR=$deps_native" >> "$GITHUB_ENV"
          echo "$deps_native" >> "$GITHUB_PATH"
          ls -l "$deps"
        else
          echo "MPV_LIBRARY_DIR=$deps/lib" >> "$GITHUB_ENV"
          echo "VESTRA_DEPS_DIR=$deps" >> "$GITHUB_ENV"
          # libmpv's install name is @rpath/libmpv.2.dylib: test binaries need
          # the rpath; bundle-macos.mjs replaces it with @executable_path/../Frameworks.
          echo "CARGO_TARGET_AARCH64_APPLE_DARWIN_RUSTFLAGS=-C link-arg=-Wl,-rpath,$deps/lib" >> "$GITHUB_ENV"
          ls -l "$deps/lib" | head -5
        fi
        jq -r '.components[] | "\(.name) \(.version) \(.license)"' "$deps/components.json"
