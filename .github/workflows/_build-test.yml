# clippy + tests (+ rustdoc) for the whole src/host workspace on a target OS.
name: build-test

on:
  workflow_call:
    inputs:
      os:
        description: windows or macos
        type: string
        required: true
      doc:
        description: Also build rustdoc with -D warnings (run on one OS only).
        type: boolean
        default: false
      cache:
        description: Use the cargo cache (release runs without).
        type: boolean
        default: true

permissions: {}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  build-test:
    name: ${{ inputs.os }}
    runs-on: ${{ inputs.os == 'windows' && 'windows-2022' || 'macos-15' }}
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
        working-directory: src/host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache: ${{ inputs.cache }}
          cache-key: build-test
      - uses: ./.github/actions/setup-libmpv
      # The host's tests start the Node plugin runner.
      - uses: ./.github/actions/setup-node
      - name: cargo clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: cargo test
        run: cargo test --locked --workspace
      # Runs even when the tests failed, for one more signal per run.
      - name: cargo doc
        if: ${{ !cancelled() && inputs.doc }}
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --no-deps --workspace --document-private-items
