# clippy + tests (+ rustdoc) for the whole src/host workspace on a target OS,
# and the recorded plugin props check (`ui-record`; `ui-only` runs just that).
name: build-test

on:
  workflow_call:
    inputs:
      os:
        description: windows or macos
        type: string
        required: true
      doc:
        description: Also build rustdoc with -D warnings (run on one OS only).
        type: boolean
        default: false
      cache:
        description: Use the cargo cache (release runs without).
        type: boolean
        default: true
      ui-record:
        description: >
          Check the property values the plugin tests recorded (artifact
          `ui-record` of _static) against the compiled Slint.
        type: boolean
        default: false
      ui-only:
        description: Only that check (no clippy, workspace tests or rustdoc).
        type: boolean
        default: false

permissions: {}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  build-test:
    name: ${{ inputs.os }}
    runs-on: ${{ inputs.os == 'windows' && 'windows-2022' || 'macos-15' }}
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
        working-directory: src/host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache: ${{ inputs.cache }}
          cache-key: build-test
          save: ${{ !inputs.ui-only }}
      - uses: ./.github/actions/setup-libmpv
      # The host's tests start the Node plugin runner.
      - uses: ./.github/actions/setup-node
        if: ${{ !inputs.ui-only }}
      - name: cargo clippy
        if: ${{ !inputs.ui-only }}
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      # Tests that need a GPU are #[ignore]d (CI VMs have none); ci:local runs them.
      - name: cargo test
        if: ${{ !inputs.ui-only }}
        run: cargo test --locked --workspace --no-fail-fast
      # The values the plugin tests sent to their windows, panels and settings
      # pages (recorded on Linux by _static), each set on the compiled Slint
      # component. After cargo test the test program is already built.
      # Runs even when the tests failed, for one more signal per run.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: ${{ !cancelled() && inputs.ui-record }}
        with:
          name: ui-record
          path: ${{ runner.temp }}/ui-record
      - name: recorded plugin props match their Slint
        if: ${{ !cancelled() && inputs.ui-record }}
        env:
          VESTRA_UI_RECORD: ${{ runner.temp }}/ui-record
        run: |
          node ../../.github/scripts/ui-record-paths.mjs absolute "$VESTRA_UI_RECORD" "$GITHUB_WORKSPACE"
          cargo test --locked --bin vestra-host -- --ignored --exact ui_types::tests::recorded_plugin_props_match_their_slint
      # Runs even when the tests failed, for one more signal per run.
      - name: cargo doc
        if: ${{ !cancelled() && inputs.doc && !inputs.ui-only }}
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --no-deps --workspace --document-private-items
      # A test program that cannot start (STATUS_DLL_NOT_FOUND) says nothing
      # about which DLL is missing: list each import and where it resolves.
      - name: Missing DLLs (Windows, after a failure)
        if: failure() && inputs.os == 'windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $version = (Get-Content "$vs\VC\Auxiliary\Build\Microsoft.VCToolsVersion.default.txt").Trim()
          $dumpbin = "$vs\VC\Tools\MSVC\$version\bin\Hostx64\x64\dumpbin.exe"
          $dirs = @("$env:SystemRoot\System32", "$env:SystemRoot") + ($env:PATH -split ';' | Where-Object { $_ })
          function Find-Dll($name, $beside) {
            if ($name -like 'api-ms-win-*' -or $name -like 'ext-ms-*') { return 'api set' }
            foreach ($dir in @($beside) + $dirs) { if ($dir -and (Test-Path (Join-Path $dir $name))) { return (Join-Path $dir $name) } }
            return $null
          }
          function Show-Imports($file, $depth) {
            $names = & $dumpbin /nologo /dependents $file | Where-Object { $_ -match '^\s+\S+\.(dll|DLL)\s*$' } | ForEach-Object { $_.Trim() }
            foreach ($name in $names) {
              $found = Find-Dll $name (Split-Path $file)
              if (-not $found) { Write-Host "::error::$(Split-Path -Leaf $file) imports $name, which is not found" }
              elseif ($depth -lt 1 -and $found -notlike "$env:SystemRoot*" -and $found -ne 'api set') {
                Write-Host "$name -> $found"; Show-Imports $found ($depth + 1)
              }
            }
          }
          Get-ChildItem target\debug\deps\*.exe | ForEach-Object { Write-Host "== $($_.Name)"; Show-Imports $_.FullName 0 }
