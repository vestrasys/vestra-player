# Daily: RustSec advisories always; the full build-test and unsigned packages
# (artifacts vestra-nightly-<date>-<sha>-<os>, kept 7 days, never released)
# only when main changed in the last 24 hours (or on manual dispatch).
name: nightly

on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  changed:
    name: main changed in 24h
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      run: ${{ steps.check.outputs.run }}
      stamp: ${{ steps.check.outputs.stamp }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: main
      - id: check
        env:
          EVENT: ${{ github.event_name }}
        run: |
          last=$(git log -1 --format=%ct)
          echo "stamp=$(date -u +%Y%m%d)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          age=$(( $(date +%s) - last ))
          echo "main tip is ${age}s old"
          if [ "$EVENT" = workflow_dispatch ] || [ "$age" -lt 86400 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  audit:
    permissions:
      contents: read
    uses: ./.github/workflows/_audit.yml
    with:
      blocking: true

  windows:
    needs: changed
    if: needs.changed.outputs.run == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/_build-test.yml
    with:
      os: windows
      doc: true

  macos:
    needs: changed
    if: needs.changed.outputs.run == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/_build-test.yml
    with:
      os: macos

  package-windows:
    needs: [changed, windows]
    if: needs.changed.outputs.run == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/_package.yml
    with:
      os: windows
      artifact: vestra-nightly-${{ needs.changed.outputs.stamp }}

  package-macos:
    needs: [changed, macos]
    if: needs.changed.outputs.run == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/_package.yml
    with:
      os: macos
      artifact: vestra-nightly-${{ needs.changed.outputs.stamp }}
