# Entry workflow for branches: orchestration only, the checks live in the
# _*.yml reusable workflows (doc/process/ci.md). main has main.yml; macOS for
# a pull request is ci-macos.yml.
#
# One run per push. There is no pull_request trigger: a same-repository PR
# shows the push run's checks (they are on its head commit), and a second
# run per push doubled the bill. This repository is private, so there are no
# fork PRs to cover.
name: CI

on:
  push:
    branches: ["**", "!main"]
    tags-ignore: ["**"]
  workflow_dispatch:
    inputs:
      full:
        description: Run everything, macOS included.
        type: boolean
        default: false

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read # plan.sh: the last green run of this workflow
    outputs:
      docs_only: ${{ steps.plan.outputs.docs_only }}
      host: ${{ steps.plan.outputs.host }}
      lock: ${{ steps.plan.outputs.lock }}
      run_windows: ${{ steps.plan.outputs.run_windows }}
      run_macos: ${{ steps.plan.outputs.run_macos }}
      plugins: ${{ steps.plan.outputs.plugins }}
      ui_props: ${{ steps.plan.outputs.ui_props }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          FULL: ${{ inputs.full || false }}
          REF: ${{ github.ref }}
          WORKFLOW: ci.yml
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/plan.sh

  static:
    needs: plan
    if: needs.plan.outputs.docs_only != 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/_static.yml
    with:
      plugins: ${{ needs.plan.outputs.plugins }}

  audit:
    needs: plan
    if: needs.plan.outputs.lock == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/_audit.yml
    with:
      blocking: false

  windows:
    needs: [plan, static]
    if: needs.plan.outputs.run_windows == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/_build-test.yml
    with:
      os: windows
      doc: true
      ui-record: ${{ needs.static.outputs.ui_record == 'true' }}

  # The recorded plugin props check when the Windows build-test does not run
  # (only plugins changed): the host's test program alone, on Windows (2x)
  # rather than macOS (10x). Linux cannot build the host.
  ui-props:
    needs: [plan, static]
    if: >-
      needs.static.outputs.ui_record == 'true' && needs.plan.outputs.ui_props == 'true'
      && needs.plan.outputs.run_windows != 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/_build-test.yml
    with:
      os: windows
      ui-record: true
      ui-only: true

  macos:
    needs: [plan, static]
    if: needs.plan.outputs.run_macos == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/_build-test.yml
    with:
      os: macos

  # The one required check: fails when anything failed or was cancelled;
  # skipped jobs count as passed.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [plan, static, audit, windows, ui-props, macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Fail when a needed job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "all needed jobs passed or were skipped"
