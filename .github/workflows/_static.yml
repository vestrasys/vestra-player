# Static checks on Ubuntu: the gate before any Windows/macOS build.
# Called by ci.yml, main.yml and release.yml (doc/process/ci.md).
name: static

on:
  workflow_call:
    inputs:
      plugins:
        description: >
          Plugins whose tests run: all, none, or space-separated directory
          names under src/plugins (plan.sh picks them from the changed paths).
        type: string
        default: all
      sdk_strict:
        description: >
          VESTRA_SDK_STRICT for test:sdk and sdk:sync-slint: true fails on
          the SDK's product data too (built-in commands, Slint copy); false
          only warns on it (doc/process/ci.md).
        type: boolean
        default: false
    outputs:
      ui_record:
        description: >
          true when the plugin tests recorded property values for their Slint
          views (artifact `ui-record`, checked by _build-test's `ui-record`).
        value: ${{ jobs.ts.outputs.ui_record }}

permissions: {}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  lint:
    name: lint (rust, typos, workflows)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: typos@1.51.1,zizmor@1.31.1,cargo-deny@0.20.2,cargo-shear@1.14.0
      - name: Install actionlint 1.7.12
        env:
          VERSION: 1.7.12
          SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="actionlint_${VERSION}_linux_amd64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/$archive"
          echo "$SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/bin" actionlint
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH" # zizmor: ignore[github-env]
      - name: typos
        run: typos
      - name: actionlint
        run: actionlint
      - name: zizmor
        run: zizmor --offline --persona regular .github
      - uses: ./.github/actions/setup-rust
        with:
          cache: "false"
      - name: cargo fmt --check
        working-directory: src/host
        run: cargo fmt --all --check
      - name: cargo deny (licenses, bans, sources)
        working-directory: src/host
        run: cargo deny --locked check licenses bans sources
      - name: cargo shear (unused dependencies)
        working-directory: src/host
        run: cargo shear
      - name: unsafe policy
        timeout-minutes: 5
        run: node src/scripts/check-unsafe-policy.mjs

  ts:
    name: ts (runtime, plugins, SDK copy)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      ui_record: ${{ steps.ui-record.outputs.recorded }}
    env:
      VESTRA_SDK_STRICT: ${{ inputs.sdk_strict && '1' || '0' }}
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node
      - run: npm run check
      - run: npm run format:check
      - run: npm run boundaries
      # Step deadlines on the Node scripts: each takes 0-15 s (plugins:build
      # about 70 s); a stuck child process or a process that does not exit
      # must fail the step, not wait for the job's 20 minutes (main.yml run
      # 41824920594). The plugin tests (about 450 s) have the job's limit.
      - name: third-party licenses (config, deny.toml/about.toml, plugin licenses)
        timeout-minutes: 5
        run: npm run licenses
      - name: Windows icon matches the logo
        timeout-minutes: 5
        run: node packaging/icon.mjs --check
      - run: npm run test:packaging
        timeout-minutes: 5
      # The host half of `portability` (cargo check for Windows) is covered by
      # the real Windows build-test job; here only the system-command scan.
      - run: npm run portability -- --skip-host
        timeout-minutes: 5
      - run: npm run test:sdk
        timeout-minutes: 5
      - run: npm run plugins:build
        timeout-minutes: 5
      # VESTRA_UI_RECORD: the tests also record every property value sent to
      # a window, panel or settings page (scripts/ui-record.mjs); the Windows
      # build-test sets each on the compiled Slint (ui-record below).
      - name: plugin tests (${{ inputs.plugins }})
        env:
          PLUGINS: ${{ inputs.plugins }}
          VESTRA_UI_RECORD: ${{ runner.temp }}/ui-record
        run: |
          case "$PLUGINS" in
            all) npm run plugin -- test --all ;;
            none) echo "no plugin changed since the last green run; plugin tests skipped" ;;
            *)
              [[ "$PLUGINS" =~ ^[a-z0-9-]+( [a-z0-9-]+)*$ ]] || { echo "::error::bad plugins input: $PLUGINS"; exit 1; }
              read -ra names <<< "$PLUGINS"
              npm run plugin -- test "${names[@]}"
              ;;
          esac
      - name: recorded plugin props
        id: ui-record
        timeout-minutes: 5
        env:
          RECORD: ${{ runner.temp }}/ui-record
        run: |
          if compgen -G "$RECORD/*.jsonl" > /dev/null; then
            node ../.github/scripts/ui-record-paths.mjs relative "$RECORD" "$GITHUB_WORKSPACE"
            echo "recorded=true" >> "$GITHUB_OUTPUT"
          else
            echo "nothing recorded (no plugin tests ran, or none opened a view)"
            echo "recorded=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.ui-record.outputs.recorded == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-record
          path: ${{ runner.temp }}/ui-record
          retention-days: 1
          if-no-files-found: error
      - name: SDK Slint copy matches host/ui
        timeout-minutes: 5
        run: npm run sdk:sync-slint
      - name: nothing generated differs from git
        run: |
          git status --porcelain
          git diff --exit-code
          test -z "$(git status --porcelain)"
