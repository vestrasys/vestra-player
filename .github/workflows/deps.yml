# Manual: build the pinned native dependencies once and mirror them to a
# `deps-<date>` prerelease of this repository (coordinator decisions 4, 14;
# doc/process/ci.md "Packaging"). Afterwards commit the deps.json this run
# attaches (and prints in its summary) as src/packaging/deps.json; CI and
# the packages then use exactly these bytes.
#
#   macOS   our libmpv (src/packaging/libmpv/build-macos.sh: the mpv commit
#           and patches of the Windows build plus the VideoToolbox frame
#           interpolation filter) against Homebrew's FFmpeg and libraries
#           (bottles) → collect-macos-deps.mjs --libmpv (dylib closure,
#           @rpath, ad-hoc signed, components.json, licenses) and the source
#           archives of mpv (with the patches and build files) and of every
#           formula (GPL source offer).
#   Windows deps.json "upstream" pins (our libmpv build from src/packaging/libmpv, BtbN ffmpeg) →
#           collect-windows-deps.mjs, plus mpv.lib for MSVC.
name: deps

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (default deps-<UTC date>). Must not exist yet.
        type: string
        default: ""
      sources:
        description: Also mirror the macOS formulae's source archives.
        type: boolean
        default: true
      platforms:
        description: >
          Rebuild only one system; the other's assets are copied from the
          release src/packaging/deps.json pins now (saves a macOS runner).
        type: choice
        options: [both, windows, macos]
        default: both

permissions: {}

concurrency:
  group: deps
  cancel-in-progress: false

jobs:
  macos:
    name: macOS arm64 (our libmpv, Homebrew)
    # Homebrew no longer bottles macOS 14 (only sequoia and newer), so the
    # bottles come from macos-15 and the package's minimum is 15.0
    # (components.json min_macos); see doc/process/ci.md. libmpv is built
    # here with the macOS 26 SDK (the low-latency interpolator) for
    # macOS 15.0 (MACOSX_DEPLOYMENT_TARGET in build-macos.sh).
    if: inputs.platforms != 'windows'
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
      - name: brew install mpv's dependencies, ffmpeg
        # mpv's libraries as bottles (Homebrew's mpv itself is not used) and
        # pkgconf for mpv's meson; meson and ninja come from build-macos.sh's
        # pinned wheels.
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
          HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: "1"
        run: |
          brew install --only-dependencies mpv
          brew install ffmpeg pkgconf
          brew deps mpv | xargs brew list --versions ffmpeg
      - name: Xcode with the macOS 26 SDK
        run: |
          xcode=$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' | sort -V | tail -1)
          if [ -z "$xcode" ]; then
            echo "::error::no Xcode 26 on this runner (the low-latency interpolator needs the macOS 26 SDK)"
            find /Applications -maxdepth 1 -name 'Xcode*.app'
            exit 1
          fi
          echo "DEVELOPER_DIR=$xcode/Contents/Developer" >> "$GITHUB_ENV"
          DEVELOPER_DIR="$xcode/Contents/Developer" xcrun --sdk macosx --show-sdk-version
      - name: Build libmpv
        run: src/packaging/libmpv/build-macos.sh "$RUNNER_TEMP/libmpv" mpv
      - name: Collect the closure
        env:
          SOURCES: ${{ inputs.sources }}
        run: |
          args=(--out "$RUNNER_TEMP/deps" --libmpv "$RUNNER_TEMP/libmpv/stage/usr/local")
          if [ "$SOURCES" = true ]; then args+=(--sources "$RUNNER_TEMP/sources"); fi
          node src/packaging/collect-macos-deps.mjs "${args[@]}"
          mkdir -p "$RUNNER_TEMP/out"
          tar -cJf "$RUNNER_TEMP/out/vestra-deps-macos-arm64.tar.xz" -C "$RUNNER_TEMP/deps" .
          if [ "$SOURCES" = true ]; then
            tar -cf "$RUNNER_TEMP/out/vestra-deps-macos-arm64-sources.tar" -C "$RUNNER_TEMP/sources" .
          fi
          cp "$RUNNER_TEMP/deps/components.json" "$RUNNER_TEMP/out/components-macos-arm64.json"
          ls -l "$RUNNER_TEMP/out"
      - name: The closure loads from its own directory
        run: |
          "$RUNNER_TEMP/deps/bin/ffprobe" -version | head -1
          if otool -L "$RUNNER_TEMP"/deps/lib/*.dylib "$RUNNER_TEMP"/deps/bin/* | grep -E '^\s+/(opt|usr/local)/'; then
            echo "::error::a reference outside the closure is left"
            exit 1
          fi
      - name: libmpv has the filter and loads on macOS 15.0
        # vtfrc checks macOS 15.4 / 26 at run time; VideoToolbox's frame
        # processor classes must be weak imports, or libmpv fails to load
        # on macOS before 15.4.
        run: |
          lib="$RUNNER_TEMP/deps/lib/libmpv.2.dylib"
          otool -l "$lib" | grep -A4 LC_BUILD_VERSION | grep -E 'minos|sdk'
          minos=$(otool -l "$lib" | awk '/LC_BUILD_VERSION/ {f=1} f && $1 == "minos" {print $2; exit}')
          [ "${minos%%.*}" -le 15 ] || { echo "::error::libmpv needs macOS $minos"; exit 1; }
          nm -m "$lib" | grep -E "_OBJC_CLASS_[$]_VT(FrameProcessor|FrameRateConversion|LowLatency)" | tee "$RUNNER_TEMP/vt.txt"
          grep -q VTLowLatencyFrameInterpolationConfiguration "$RUNNER_TEMP/vt.txt" || { echo "::error::built without the low-latency interpolator"; exit 1; }
          if grep -v 'weak external' "$RUNNER_TEMP/vt.txt"; then
            echo "::error::VideoToolbox frame processor classes not weakly imported"
            exit 1
          fi
          strings "$lib" > "$RUNNER_TEMP/strings.txt"
          grep -q 'VideoToolbox frame interpolation' "$RUNNER_TEMP/strings.txt" || { echo "::error::vtfrc is missing"; exit 1; }
          jq -r '.min_macos, (.components[] | select(.name == "mpv") | "\(.name) \(.version)")' "$RUNNER_TEMP/deps/components.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deps-macos
          path: ${{ runner.temp }}/out
          retention-days: 1
          if-no-files-found: error

  windows:
    name: Windows x64 (our libmpv, BtbN, Vulkan loader)
    if: inputs.platforms != 'macos'
    runs-on: windows-2022
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
      - name: Collect
        # The libmpv pin is a release asset of this (private) repository:
        # collect-windows-deps.mjs fetches it with gh.
        env:
          GH_TOKEN: ${{ github.token }}
        run: node src/packaging/collect-windows-deps.mjs --out "$env:RUNNER_TEMP\deps"
      # MSVC import library from the DLL's export table (rsmpv-sys links mpv.lib).
      - name: mpv.lib
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = "$env:RUNNER_TEMP\deps"
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $version = (Get-Content "$vs\VC\Auxiliary\Build\Microsoft.VCToolsVersion.default.txt").Trim()
          $bin = "$vs\VC\Tools\MSVC\$version\bin\Hostx64\x64"
          $exports = & "$bin\dumpbin.exe" /nologo /exports "$dir\libmpv-2.dll"
          $names = $exports | ForEach-Object {
            if ($_ -match '^\s+\d+\s+[0-9A-Fa-f]+\s+[0-9A-Fa-f]{8}\s+(\S+)') { $Matches[1] }
          }
          if (-not $names) { throw 'no exports found in libmpv-2.dll' }
          Write-Host "libmpv-2.dll exports $($names.Count) symbols"
          Set-Content -Path "$env:RUNNER_TEMP\mpv.def" -Value (@('LIBRARY libmpv-2', 'EXPORTS') + $names)
          & "$bin\lib.exe" /nologo /def:"$env:RUNNER_TEMP\mpv.def" /machine:x64 /out:"$dir\mpv.lib"
          if ($LASTEXITCODE -ne 0) { throw 'lib.exe failed' }
          Remove-Item "$dir\mpv.exp" -ErrorAction SilentlyContinue
      - name: Archive
        run: |
          $ErrorActionPreference = 'Stop'
          $out = "$env:RUNNER_TEMP\out"
          New-Item -ItemType Directory -Force $out | Out-Null
          Push-Location "$env:RUNNER_TEMP\deps"
          7z a -tzip -mx=9 "$out\vestra-deps-windows-x64.zip" * | Out-Null
          if ($LASTEXITCODE -ne 0) { throw '7z failed' }
          Pop-Location
          Copy-Item "$env:RUNNER_TEMP\deps\components.json" "$out\components-windows-x64.json"
          & "$env:RUNNER_TEMP\deps\ffmpeg\ffprobe.exe" -version | Select-Object -First 1
          Get-ChildItem $out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deps-windows
          path: ${{ runner.temp }}/out
          retention-days: 1
          if-no-files-found: error

  release:
    name: deps release
    needs: [macos, windows]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: deps-*
          path: ${{ runner.temp }}/assets
          merge-multiple: true
      - name: Copy the assets of a system not rebuilt
        if: inputs.platforms != 'both'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          pins=src/packaging/deps.json
          old=$(jq -r .release "$pins")
          if [ "$PLATFORMS" = windows ]; then keys="macos-arm64 macos-arm64-sources"; json=components-macos-arm64.json
          else keys="windows-x64"; json=components-windows-x64.json; fi
          gh release download "$old" --pattern "$json" --dir "$RUNNER_TEMP/assets"
          for key in $keys; do
            file=$(jq -r --arg key "$key" '.assets[$key].file // empty' "$pins")
            [ -n "$file" ] || continue
            sha=$(jq -r --arg key "$key" '.assets[$key].sha256' "$pins")
            gh release download "$old" --pattern "$file" --dir "$RUNNER_TEMP/assets"
            echo "$sha  $RUNNER_TEMP/assets/$file" | sha256sum -c -
          done
      - name: Create the release and the new deps.json
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          INPUT_TAG: ${{ inputs.tag }}
          SHA: ${{ github.sha }}
        run: |
          tag="${INPUT_TAG:-deps-$(date -u +%Y%m%d)}"
          case "$tag" in deps-*) ;; *) echo "::error::the tag must start with deps-"; exit 1 ;; esac
          cd "$RUNNER_TEMP/assets"
          sha256sum ./* | sed 's| \./| |' > SHA256SUMS
          cat SHA256SUMS
          sum() { awk -v f="$1" '$2 == f { print $1 }' SHA256SUMS; }
          asset() { jq -n --arg file "$1" --arg sha "$(sum "$1")" '{file: $file, sha256: $sha}'; }
          assets=$(jq -n \
            --argjson mac "$(asset vestra-deps-macos-arm64.tar.xz)" \
            --argjson win "$(asset vestra-deps-windows-x64.zip)" \
            '{"macos-arm64": $mac, "windows-x64": $win}')
          if [ -f vestra-deps-macos-arm64-sources.tar ]; then
            assets=$(jq --argjson src "$(asset vestra-deps-macos-arm64-sources.tar)" '. + {"macos-arm64-sources": $src}' <<< "$assets")
          fi
          jq --arg tag "$tag" --argjson assets "$assets" '.release = $tag | .assets = $assets' \
            "$GITHUB_WORKSPACE/src/packaging/deps.json" > deps.json
          min=$(jq -r .min_macos components-macos-arm64.json)
          {
            echo "Native dependencies for Vestra Player packages, built by deps.yml from $SHA."
            echo
            echo "macOS arm64 (minimum macOS $min):"
            jq -r '.components[] | "- \(.name) \(.version) (\(.license))"' components-macos-arm64.json
            echo
            echo "Windows x64:"
            jq -r '.components[] | "- \(.name) \(.version) (\(.license)): \(.source.archive)"' components-windows-x64.json
            echo
            echo "Commit the attached deps.json as src/packaging/deps.json to use this release."
          } > notes.md
          files=(./*.tar.xz ./*.zip ./*.json SHA256SUMS)
          if [ -f vestra-deps-macos-arm64-sources.tar ]; then files+=(vestra-deps-macos-arm64-sources.tar); fi
          gh release create "$tag" --prerelease --target "$SHA" --title "Native dependencies $tag" \
            --notes-file notes.md "${files[@]}"
          {
            echo "## $tag"
            echo
            echo "New src/packaging/deps.json:"
            echo
            echo "~~~json"
            cat deps.json
            echo "~~~"
          } >> "$GITHUB_STEP_SUMMARY"
