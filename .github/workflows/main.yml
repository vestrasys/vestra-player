# Every push to main: the checks the changed paths need, Windows and macOS
# for host changes unless a branch run already passed that OS on the same
# tree (plan.sh; docs-only pushes run plan and ci-ok only). These runs write
# the cargo caches that branch runs restore (doc/process/ci.md).
name: main

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: main-${{ github.ref }}
  # Let each main run finish: it is the one that saves the caches. A pending
  # run replaced by a newer push is not lost: plan.sh counts the changes from
  # the last green main run.
  cancel-in-progress: false

jobs:
  plan:
    name: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read # plan.sh: the last green run of this workflow
    outputs:
      docs_only: ${{ steps.plan.outputs.docs_only }}
      run_windows: ${{ steps.plan.outputs.run_windows }}
      run_macos: ${{ steps.plan.outputs.run_macos }}
      plugins: ${{ steps.plan.outputs.plugins }}
      ui_props: ${{ steps.plan.outputs.ui_props }}
      builtin_base: ${{ steps.builtin-base.outputs.builtin_base }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          FULL: "false"
          REF: ${{ github.ref }}
          WORKFLOW: main.yml
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/plan.sh
      - id: builtin-base
        env:
          REF: ${{ github.ref }}
        run: bash .github/scripts/builtin-base.sh

  static:
    needs: plan
    if: needs.plan.outputs.docs_only != 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/_static.yml
    with:
      plugins: ${{ needs.plan.outputs.plugins }}
      builtin-base: ${{ needs.plan.outputs.builtin_base }}

  windows:
    needs: [plan, static]
    if: needs.plan.outputs.run_windows == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/_build-test.yml
    with:
      os: windows
      doc: true
      ui-record: ${{ needs.static.outputs.ui_record == 'true' }}

  # The recorded plugin props check when the Windows build-test does not run
  # (only plugins changed): the host's test program alone, on Windows (2x)
  # rather than macOS (10x). Linux cannot build the host.
  ui-props:
    needs: [plan, static]
    if: >-
      needs.static.outputs.ui_record == 'true' && needs.plan.outputs.ui_props == 'true'
      && needs.plan.outputs.run_windows != 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/_build-test.yml
    with:
      os: windows
      ui-record: true
      ui-only: true

  macos:
    needs: [plan, static]
    if: needs.plan.outputs.run_macos == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/_build-test.yml
    with:
      os: macos

  ci-ok:
    name: ci-ok
    if: always()
    needs: [plan, static, windows, ui-props, macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Fail when a needed job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "all needed jobs passed or were skipped"
