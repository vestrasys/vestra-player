# Unsigned packages (doc/process/ci.md "Packaging"): release build, or with
# `reuse-host` the host binary of a published release built from the same
# host inputs (src/packaging/host.mjs; doc/process/ci.md "Reusing the host
# binary") → bundle (macOS .app + DMG, Windows staged dir + Inno Setup
# installer + portable zip) → license check (inside the bundle scripts) →
# headless smoke test without node on PATH → artifact, plus this platform's
# host.json entry (artifact host-<artifact>-<os>). Signing happens in
# release.yml.
name: package

on:
  workflow_call:
    inputs:
      os:
        description: windows or macos
        type: string
        required: true
      artifact:
        description: Artifact name (the OS is appended), e.g. vestra-unsigned.
        type: string
        default: vestra-unsigned
      retention-days:
        type: number
        default: 1
      cache:
        type: boolean
        default: false
      reuse-host:
        description: >
          Take the host binary (and its crate license page) from the newest
          published release whose host.json lists the same host input hash,
          verified against that release's SHA256SUMS; build it otherwise.
        type: boolean
        default: false

permissions: {}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  package:
    name: package ${{ inputs.os }}
    runs-on: ${{ inputs.os == 'windows' && 'windows-2022' || 'macos-15' }}
    timeout-minutes: 90
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node
      - uses: ./.github/actions/setup-libmpv
      # A release that changes no host input (plugins, runtime, docs, the
      # release version) ships the host of an earlier release: no toolchain,
      # no cargo build, no cargo about.
      - name: Reuse a released host
        id: reuse
        if: inputs.reuse-host
        # Step deadlines on the Node scripts here (normally: fetch 2-5 s,
        # record 1 s; Bundle 150 s on macOS, 415 s on Windows with
        # cargo about): a script that does not exit fails its step instead
        # of running to the job's 90 minutes.
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TARGET: ${{ inputs.os == 'windows' && 'x86_64-pc-windows-msvc' || 'aarch64-apple-darwin' }}
        run: node src/packaging/host.mjs fetch --target "$TARGET" --repo "$REPO" --out "$RUNNER_TEMP/host"
      - uses: ./.github/actions/setup-rust
        if: steps.reuse.outputs.found != 'true'
        with:
          cache: ${{ inputs.cache }}
          cache-key: package
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        if: steps.reuse.outputs.found != 'true'
        with:
          tool: cargo-about@0.9.2
      - name: cargo build --release
        if: steps.reuse.outputs.found != 'true'
        working-directory: src/host
        run: cargo build --release --locked
      - name: Bundle
        timeout-minutes: 30
        env:
          OS: ${{ inputs.os }}
          FOUND: ${{ steps.reuse.outputs.found }}
          REUSED_BINARY: ${{ steps.reuse.outputs.binary }}
          REUSED_LICENSES: ${{ steps.reuse.outputs.licenses }}
        run: |
          if [ "$FOUND" = true ]; then
            host=(--binary "$REUSED_BINARY" --rust-licenses "$REUSED_LICENSES")
          elif [ "$OS" = windows ]; then
            host=(--binary src/host/target/release/vestra-host.exe)
          else
            host=(--binary src/host/target/release/vestra-host)
          fi
          if [ "$OS" = windows ]; then
            node src/packaging/bundle-windows.mjs --out "$RUNNER_TEMP/dist" "${host[@]}"
          else
            node src/packaging/bundle-macos.mjs --out "$RUNNER_TEMP/dist" "${host[@]}" --zip
          fi
      - name: Collect the artifacts
        id: collect
        run: |
          mkdir -p "$RUNNER_TEMP/upload"
          find "$RUNNER_TEMP/dist" -maxdepth 1 -type f \( -name '*.dmg' -o -name '*.app.zip' -o -name '*-setup.exe' -o -name '*-portable.zip' \) \
            -exec mv {} "$RUNNER_TEMP/upload/" \;
          ls -l "$RUNNER_TEMP/upload"
          test -n "$(ls "$RUNNER_TEMP/upload")"
      # This platform's entry of the release's host.json (release.yml merges
      # them): the host input hash, host version, the commit the binary was
      # built from and its SHA-256 inside the archive, so a later release
      # with the same inputs can reuse it.
      # TODO(S7 signing): record from the signed archive.
      - name: host.json entry
        timeout-minutes: 5
        env:
          OS: ${{ inputs.os }}
          FOUND: ${{ steps.reuse.outputs.found }}
          REUSED_RECORD: ${{ steps.reuse.outputs.record }}
        run: |
          if [ "$OS" = windows ]; then
            target=x86_64-pc-windows-msvc
            archive=$(ls "$RUNNER_TEMP"/upload/*-windows-x64-portable.zip)
          else
            target=aarch64-apple-darwin
            archive=$(ls "$RUNNER_TEMP"/upload/*-macos-arm64.app.zip)
          fi
          reused=()
          [ "$FOUND" = true ] && reused=(--reused "$REUSED_RECORD")
          node src/packaging/host.mjs record --target "$target" --archive "$archive" \
            --out "$RUNNER_TEMP/host-record/host-$OS.json" "${reused[@]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact }}-${{ inputs.os }}
          path: ${{ runner.temp }}/upload
          retention-days: ${{ inputs.retention-days }}
          if-no-files-found: error
          compression-level: 0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: host-${{ inputs.artifact }}-${{ inputs.os }}
          path: ${{ runner.temp }}/host-record
          retention-days: ${{ inputs.retention-days }}
          if-no-files-found: error

      - name: Smoke test (macOS, the DMG's app)
        if: inputs.os == 'macos'
        # The host runs 15 s (smoke.mjs kills it 60 s later): a hang fails here.
        timeout-minutes: 10
        run: |
          dmg=$(ls "$RUNNER_TEMP"/upload/*.dmg)
          mount=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$mount" "$dmg"
          ditto "$mount/Vestra Player.app" "$RUNNER_TEMP/smoke/Vestra Player.app"
          hdiutil detach "$mount"
          app="$RUNNER_TEMP/smoke/Vestra Player.app"
          codesign --verify --deep --strict "$app"
          plutil -p "$app/Contents/Info.plist"
          node src/packaging/smoke.mjs --exe "$app/Contents/MacOS/vestra-host" \
            --plugins "$app/Contents/Resources/plugins"

      - name: Smoke test (Windows, silent install → run → uninstall)
        if: inputs.os == 'windows'
        # Install, a 45 s headless run and uninstall take about a minute; a
        # hung installer or uninstaller fails here instead of at the job limit.
        timeout-minutes: 10
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $setup = Get-ChildItem "$env:RUNNER_TEMP\upload\*-setup.exe" | Select-Object -First 1
          $dir = "$env:RUNNER_TEMP\smoke-install"
          $p = Start-Process -Wait -PassThru $setup.FullName -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/CURRENTUSER', '/NORESTART', "/DIR=$dir", "/LOG=$env:RUNNER_TEMP\setup.log"
          if ($p.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP\setup.log"; throw "setup exited with $($p.ExitCode)" }
          Get-ChildItem $dir
          node src/packaging/smoke.mjs --exe "$dir\vestra-host.exe" --plugins "$dir\resources\plugins"
          $smoke = $LASTEXITCODE
          $p = Start-Process -Wait -PassThru "$dir\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'
          if ($p.ExitCode -ne 0) { throw "uninstall exited with $($p.ExitCode)" }
          Start-Sleep -Seconds 3
          if (Test-Path "$dir\vestra-host.exe") { throw 'uninstall left vestra-host.exe behind' }
          if ($smoke -ne 0) { throw "smoke test failed ($smoke)" }

      # MSVC's link.exe leaves its telemetry process (vctip.exe) running; the
      # runner's orphan clean-up once hung on it for an hour after every step
      # had finished (nightly run 41284977594). Stop it ourselves.
      - name: Stop MSVC telemetry (vctip)
        if: always() && inputs.os == 'windows'
        timeout-minutes: 2
        shell: pwsh
        run: Stop-Process -Name vctip -Force -ErrorAction SilentlyContinue; exit 0
