# Tag v* (or a manual dry run): the static checks and both build-tests (no
# caches) unless main.yml already passed this commit or one it differs from
# only in docs (.github/scripts/main-green.sh); the unsigned packages (macOS
# .dmg + .app zip, Windows setup.exe + portable zip, plus copies of the
# installers under fixed names for releases/latest/download/), host.json
# (per platform the host input hash, host version and commit of the host
# binary inside, so that a later release with the same host inputs reuses
# that binary instead of building it: src/packaging/host.mjs), SHA256SUMS,
# latest.json (the release's description of itself, for update checks and
# the download page) and a draft GitHub release in this repository with the notes from
# doc/releases/v<version>.md. <version> is the player release version in
# src/release.json; the host binary has its own (src/host/Cargo.toml, never
# higher). sign-macos signs the macOS .app and DMG with the Developer ID
# certificate and notarizes both (doc/releases/macos-signing.md; secrets in
# the `release` environment); Windows stays unsigned for now (sign-windows is
# a TODO). How to cut a release: doc/releases/README.md.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build, check and package only; no signing, no draft release.
        type: boolean
        default: true
      platforms:
        description: >
          Dry runs only: build and package one system to save minutes
          (macOS runners cost 10x). Tag releases always build both.
        type: choice
        options: [both, windows, macos]
        default: both
      checks:
        description: >
          Run static and build-test even when main.yml already passed this
          commit.
        type: boolean
        default: false
      fresh_host:
        description: >
          Build the host even when a published release has one built from
          the same host inputs. Tag releases always reuse when they can.
        type: boolean
        default: false
      sign_macos:
        description: >
          Dry runs only: sign and notarize the macOS packages too, to test
          them before a tag (about 15-25 macOS minutes). Without the signing
          secrets the job warns and the packages stay unsigned. Tag releases
          always sign, and fail without the secrets.
        type: boolean
        default: false

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: tag, version, notes, pins
    runs-on: ubuntu-24.04
    # Up to 30 minutes when the tag was pushed with its main commit: waiting
    # on Linux costs less than the checks on Windows and macOS.
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read # main-green.sh: main.yml runs
    outputs:
      version: ${{ steps.version.outputs.version }}
      host_version: ${{ steps.version.outputs.host }}
      tested: ${{ steps.tested.outputs.tested }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # The pinned Node (26) for host.mjs, not whatever the image carries.
      - uses: ./.github/actions/setup-node
      # The release version (src/release.json) names the tag, the notes and
      # the files; the host version (src/host/Cargo.toml) stays lower while
      # the host does not change, and is never higher. `host.mjs versions`
      # checks both are x.y.z and release ≥ host (Node built-ins only).
      # Step deadlines: host.mjs takes 0-2 s here; one that does not exit
      # fails its step instead of running to the job's 40 minutes.
      - id: version
        timeout-minutes: 5
        env:
          REF_TYPE: ${{ github.ref_type }}
          TAG: ${{ github.ref_name }}
        run: |
          node src/packaging/host.mjs versions \
            || { echo "::error::src/release.json and src/host/Cargo.toml: see the line above"; exit 1; }
          version=$(jq -r .version src/release.json)
          if [ "$REF_TYPE" = tag ] && [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG does not match the release version $version in src/release.json"
            exit 1
          fi
          notes="doc/releases/v$version.md"
          if [ ! -s "$notes" ]; then
            if [ "$REF_TYPE" = tag ]; then
              echo "::error::$notes is missing (the release notes; see doc/releases/README.md)"
              exit 1
            fi
            echo "::warning::$notes is missing; a tag release would fail here"
          fi
          jq -e '.release and .assets["macos-arm64"] and .assets["windows-x64"]' src/packaging/deps.json > /dev/null \
            || { echo "::error::src/packaging/deps.json pins no deps release"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # One host version names one host: when the host inputs changed since a
      # published release shipped this host version, src/host/Cargo.toml must
      # go up (everything keyed by the host version, such as the GPU crash
      # guard, would otherwise carry over to a different binary). Fails also
      # when the host version is below a released one. Both platforms, even
      # on a one-platform dry run.
      - name: host version raised when the host changed (check-bump)
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: node src/packaging/host.mjs check-bump --repo "$REPO"
      - name: main.yml already passed this commit?
        id: tested
        if: ${{ !inputs.checks }}
        env:
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          WAIT: "1800"
        run: bash .github/scripts/main-green.sh

  # Strict SDK agreement (doc/releases/README.md): the SDK's product data
  # (built-in commands, Slint copy, Chinese texts, palette colours) only warns
  # on main; a release ships an SDK that matches it. Runs even when main.yml
  # already passed the commit.
  sdk-agreement:
    name: SDK agreement (strict)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: src
    env:
      VESTRA_SDK_STRICT: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node
      - run: npm run test:sdk
        timeout-minutes: 5
      - run: npm run sdk:sync-slint -- --strict
        timeout-minutes: 5

  static:
    needs: verify
    if: needs.verify.outputs.tested != 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/_static.yml

  windows:
    needs: static
    if: inputs.platforms != 'macos'
    permissions:
      contents: read
    uses: ./.github/workflows/_build-test.yml
    with:
      os: windows
      doc: true
      cache: false
      ui-record: ${{ needs.static.outputs.ui_record == 'true' }}

  macos:
    needs: static
    if: inputs.platforms != 'windows'
    permissions:
      contents: read
    uses: ./.github/workflows/_build-test.yml
    with:
      os: macos
      cache: false
      # Windows checks the recorded plugin props, unless only macOS runs.
      ui-record: ${{ needs.static.outputs.ui_record == 'true' && inputs.platforms == 'macos' }}

  # After build-test, or straight away when main.yml already passed it;
  # always after the strict SDK agreement.
  package-windows:
    needs: [verify, sdk-agreement, windows]
    if: >-
      !cancelled() && needs.verify.result == 'success' && needs.sdk-agreement.result == 'success'
      && inputs.platforms != 'macos'
      && (needs.verify.outputs.tested == 'true' || needs.windows.result == 'success')
    permissions:
      contents: read
    uses: ./.github/workflows/_package.yml
    with:
      os: windows
      reuse-host: ${{ !inputs.fresh_host }}

  package-macos:
    needs: [verify, sdk-agreement, macos]
    if: >-
      !cancelled() && needs.verify.result == 'success' && needs.sdk-agreement.result == 'success'
      && inputs.platforms != 'windows'
      && (needs.verify.outputs.tested == 'true' || needs.macos.result == 'success')
    permissions:
      contents: read
    uses: ./.github/workflows/_package.yml
    with:
      os: macos
      reuse-host: ${{ !inputs.fresh_host }}

  # SHA256SUMS lists the fixed-name copies too (same hash as the versioned
  # file): whoever downloads releases/latest/download/<fixed name> can check
  # it with `sha256sum -c --ignore-missing SHA256SUMS`. The copies are not
  # uploaded as an artifact (the 500 MB artifact quota); draft-release makes
  # them again from the uploaded files and checks them against this list.
  # macOS: the signed and notarized files (artifact vestra-signed-macos and
  # its host.json entry) when sign-macos signed, the unsigned ones in a dry
  # run that did not sign. Windows: unsigned (no sign-windows yet).
  checksums:
    name: SHA256SUMS
    needs: [verify, package-windows, package-macos, sign-macos]
    # One system may be skipped in a dry run (platforms); at least one must
    # have packaged. A failed sign-macos stops it (and so the draft release).
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && (needs.package-windows.result == 'success' || needs.package-macos.result == 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/scripts
            src/packaging/windows
      # One download per packaged system (a dry run may skip one).
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.package-windows.result == 'success'
        with:
          name: vestra-unsigned-windows
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.package-windows.result == 'success'
        with:
          name: host-vestra-unsigned-windows
          path: host-records
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.package-macos.result == 'success'
        with:
          name: ${{ needs.sign-macos.outputs.signed == 'true' && 'vestra-signed-macos' || 'vestra-unsigned-macos' }}
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.package-macos.result == 'success'
        with:
          name: ${{ needs.sign-macos.outputs.signed == 'true' && 'host-vestra-signed-macos' || 'host-vestra-unsigned-macos' }}
          path: host-records
      # host.json: one entry per packaged platform (_package.yml "host.json
      # entry"), listed in SHA256SUMS so that a later release checks it
      # before it reuses the host binary (src/packaging/host.mjs fetch).
      - name: host.json
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          HOST_VERSION: ${{ needs.verify.outputs.host_version }}
          SHA: ${{ github.sha }}
        run: |
          jq -s --arg v "$VERSION" --arg h "$HOST_VERSION" --arg c "$SHA" \
            '{schema: 1, release: $v, hostVersion: $h, commit: $c, hosts: add}' \
            host-records/host-*.json > dist/host.json
          jq -e --arg h "$HOST_VERSION" \
            '(.hosts | length > 0) and ([.hosts[] | .hostVersion == $h and (.inputHash | test("^[0-9a-f]{64}$"))] | all)' \
            dist/host.json > /dev/null || { echo "::error::host.json entries are incomplete"; exit 1; }
          cat dist/host.json
      - name: Fixed-name copies of the installers
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: bash .github/scripts/stable-names.sh dist "$VERSION"
      - name: sha256sum
        working-directory: dist
        run: |
          sha256sum ./* | sed 's| \./| |' > SHA256SUMS
          cat SHA256SUMS
          ls -l
      # Dry runs exercise latest.json here (written after SHA256SUMS, so not
      # listed in it); it is not uploaded: draft-release writes it again
      # from the files it uploads.
      - name: latest.json (check only)
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          bash .github/scripts/latest-json.sh write dist "$VERSION" "$REPO"
          bash .github/scripts/latest-json.sh check dist "$VERSION" "$REPO"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vestra-checksums
          path: |
            dist/SHA256SUMS
            dist/host.json
          retention-days: 1
          if-no-files-found: error

  # Developer ID signing and notarization with Apple's own tools
  # (doc/releases/macos-signing.md has the secrets and how to make them).
  # From the packaged (ad-hoc signed) .app.zip: every nested Mach-O inside
  # out with the Hardened Runtime and a timestamp (dylibs, ffmpeg, ffprobe,
  # anything else found), node with node.entitlements (V8's JIT), the host
  # and then the bundle with host.entitlements; no --deep signing. Notarize
  # and staple the .app, zip it, build a new DMG from it, sign, notarize and
  # staple the DMG; check both with codesign, spctl and stapler. Output:
  # artifact vestra-signed-macos (same file names as vestra-unsigned-macos)
  # and host-vestra-signed-macos (the host.json entry with the signed host
  # binary's SHA-256, which a later release checks before it reuses it).
  # Runs no repository code: the entitlements files are the only checkout.
  #
  # Missing secrets: a tag release (or a dispatch with dry_run off) fails
  # here; a dry run with sign_macos warns and ships the unsigned packages on
  # (`signed` output false).
  sign-macos:
    name: sign and notarize macOS
    needs: package-macos
    # !cancelled(): the implicit success() also fails when a job further up
    # was skipped (the build-test jobs are, when main.yml already tested the
    # commit), which skipped signing and the draft release in v0.6.2.
    if: >-
      ${{ !cancelled() && needs.package-macos.result == 'success'
      && (!inputs.dry_run || inputs.sign_macos) }}
    # The image the package job builds on.
    runs-on: macos-15
    # Two notarizations of up to 30 minutes each (notarytool --timeout;
    # usually 2-10), plus signing with timestamps, the DMG and the checks.
    timeout-minutes: 100
    environment: release
    permissions:
      contents: read
    outputs:
      signed: ${{ steps.secrets.outputs.signed }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Signing secrets present?
        id: secrets
        env:
          # Empty on a tag push: a real release.
          DRY_RUN: ${{ inputs.dry_run }}
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          missing=()
          for name in MACOS_CERT_P12_BASE64 MACOS_CERT_PASSWORD APPLE_API_KEY_P8_BASE64 \
            APPLE_API_KEY_ID APPLE_API_ISSUER_ID; do
            [ -n "${!name}" ] || missing+=("secret $name")
          done
          # Not secret: a repository variable.
          [[ "$APPLE_TEAM_ID" =~ ^[A-Z0-9]{10}$ ]] || missing+=("variable APPLE_TEAM_ID")
          if [ ${#missing[@]} -eq 0 ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$DRY_RUN" = true ]; then
            echo "::warning::macOS signing skipped (dry run): missing ${missing[*]} (doc/releases/macos-signing.md). The macOS packages stay unsigned."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::error::macOS signing needs ${missing[*]} (doc/releases/macos-signing.md); a release does not ship unsigned macOS packages."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.secrets.outputs.signed == 'true'
        with:
          persist-credentials: false
          sparse-checkout: src/packaging/macos
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.secrets.outputs.signed == 'true'
        with:
          name: vestra-unsigned-macos
          path: ${{ runner.temp }}/unsigned
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.secrets.outputs.signed == 'true'
        with:
          name: host-vestra-unsigned-macos
          path: ${{ runner.temp }}/host-record
      # A keychain of its own with a random password (never stored), holding
      # only the Developer ID Application identity; deleted at the end.
      - name: Keychain with the Developer ID certificate
        id: keychain
        if: steps.secrets.outputs.signed == 'true'
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          # DeveloperIDG2CA.cer (CN=Developer ID Certification Authority,
          # OU=G2; valid to 2031-09-17).
          DEVELOPER_ID_G2_SHA256: f16cd3c54c7f83cea4bf1a3e6a0819c8aaa8e4a1528fd144715f350643d2df3a
        run: |
          umask 077
          keychain="$RUNNER_TEMP/vestra-signing.keychain-db"
          password=$(openssl rand -hex 24)
          echo "::add-mask::$password"
          p12="$RUNNER_TEMP/vestra-signing.p12"
          printf '%s' "$MACOS_CERT_P12_BASE64" | tr -d ' \r\n' | base64 --decode > "$p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$p12" -k "$keychain" -f pkcs12 -P "$MACOS_CERT_PASSWORD" \
            -T /usr/bin/codesign > /dev/null \
            || { rm -f "$p12"; echo "::error::MACOS_CERT_P12_BASE64 / MACOS_CERT_PASSWORD: the .p12 does not import"; exit 1; }
          rm -f "$p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null
          # Apple's Developer ID intermediate (G2), so that the chain resolves
          # whatever the runner image carries; pinned by SHA-256.
          ca="$RUNNER_TEMP/DeveloperIDG2CA.cer"
          curl -sSfL --retry 3 -o "$ca" https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          echo "$DEVELOPER_ID_G2_SHA256  $ca" | shasum -a 256 -c -
          security import "$ca" -k "$keychain" > /dev/null
          # Searched first, after it the user keychains already listed.
          old=()
          while IFS= read -r line; do
            line=${line#"${line%%[![:space:]]*}"}
            line=${line#\"}
            old+=("${line%\"}")
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "$keychain" "${old[@]}"
          identities=$(security find-identity -v -p codesigning "$keychain")
          line=$(grep -F "Developer ID Application: " <<< "$identities" | grep -F "($APPLE_TEAM_ID)" | head -n 1 || true)
          if [ -z "$line" ]; then
            echo "$identities" | sed -E 's/[0-9A-F]{40}/<hash>/'
            echo "::error::the .p12 holds no valid \"Developer ID Application: … (APPLE_TEAM_ID)\" identity"
            exit 1
          fi
          echo "Signing as: $(sed -E 's/^ *[0-9]+\) [0-9A-F]{40} //' <<< "$line")"
          {
            echo "identity=$(awk '{ print $2 }' <<< "$line")"
            echo "path=$keychain"
          } >> "$GITHUB_OUTPUT"
      - name: Sign the .app inside out
        id: sign
        if: steps.secrets.outputs.signed == 'true'
        env:
          IDENTITY: ${{ steps.keychain.outputs.identity }}
          KEYCHAIN: ${{ steps.keychain.outputs.path }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          zip=$(ls "$RUNNER_TEMP"/unsigned/*-macos-arm64.app.zip)
          dmg=$(ls "$RUNNER_TEMP"/unsigned/*-macos-arm64.dmg)
          work="$RUNNER_TEMP/sign"
          rm -rf "$work" && mkdir -p "$work"
          ditto -x -k "$zip" "$work"
          app=$(ls -d "$work"/*.app)
          contents="$app/Contents"
          main="$contents/MacOS/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$contents/Info.plist")"
          node="$contents/MacOS/node"
          entitlements="$GITHUB_WORKSPACE/src/packaging/macos"
          test -f "$main"
          test -f "$node"
          # Nested bundles would need signing as bundles, inside out; the
          # layout has none (bundle-macos.mjs), so one appearing is an error.
          bundles=$(find "$contents" \( -name '*.framework' -o -name '*.app' -o -name '*.xpc' -o -name '*.bundle' \) -print)
          if [ -n "$bundles" ]; then
            echo "$bundles"
            echo "::error::nested bundles under Contents (see above): sign-macos signs plain Mach-O files only"
            exit 1
          fi
          # codesign, retried when the timestamp server fails (3 more tries,
          # 15 s apart); any other error fails at once.
          sign() {
            local try output
            for try in 1 2 3 4; do
              if output=$(codesign --force --sign "$IDENTITY" --keychain "$KEYCHAIN" \
                --options runtime --timestamp "$@" 2>&1); then
                [ -z "$output" ] || echo "$output"
                return 0
              fi
              echo "$output"
              grep -qi 'timestamp' <<< "$output" && [ "$try" != 4 ] || return 1
              echo "::warning::timestamp server error (try $try), again in 15 s"
              sleep 15
            done
          }
          # Every Mach-O but node and the host, deepest path first.
          find "$contents" -type f > "$work/files.txt"
          : > "$work/nested.txt"
          while IFS= read -r file; do
            [ "$file" = "$main" ] || [ "$file" = "$node" ] && continue
            case $(file -b "$file") in
              Mach-O*) printf '%s\t%s\n' "$(tr -cd / <<< "$file" | wc -c)" "$file" >> "$work/nested.txt" ;;
            esac
          done < "$work/files.txt"
          sort -rn "$work/nested.txt" | cut -f2- > "$work/order.txt"
          test -s "$work/order.txt" || { echo "::error::no nested Mach-O files in $app"; exit 1; }
          while IFS= read -r file; do
            echo "sign ${file#"$work/"}"
            sign "$file"
          done < "$work/order.txt"
          sign --entitlements "$entitlements/node.entitlements" "$node"
          sign --entitlements "$entitlements/host.entitlements" "$main"
          sign --entitlements "$entitlements/host.entitlements" "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          # Each Mach-O: our team, the Hardened Runtime, a secure timestamp.
          { cat "$work/order.txt"; echo "$node"; echo "$main"; } | while IFS= read -r file; do
            details=$(codesign -d --verbose=4 "$file" 2>&1)
            grep -qx "TeamIdentifier=$APPLE_TEAM_ID" <<< "$details" \
              || { echo "::error::${file#"$work/"}: not signed by team $APPLE_TEAM_ID"; exit 1; }
            grep -q '^CodeDirectory .*flags=.*runtime' <<< "$details" \
              || { echo "::error::${file#"$work/"}: no Hardened Runtime"; exit 1; }
            grep -q '^Timestamp=' <<< "$details" \
              || { echo "::error::${file#"$work/"}: no secure timestamp"; exit 1; }
          done
          codesign -d --entitlements - "$node"
          {
            echo "app=$app"
            echo "zip=$(basename "$zip")"
            echo "dmg=$(basename "$dmg")"
          } >> "$GITHUB_OUTPUT"
      # The status decides, not notarytool's exit code (`|| true`, so that a
      # failed wait still prints the submission id and fetches its log). The
      # log (issues, also warnings on an accepted one) is printed always.
      # stapler and the timestamp server sometimes fail transiently: retried.
      - name: Notarize and staple (.app, then the DMG built from it)
        if: steps.secrets.outputs.signed == 'true'
        env:
          IDENTITY: ${{ steps.keychain.outputs.identity }}
          KEYCHAIN: ${{ steps.keychain.outputs.path }}
          APP: ${{ steps.sign.outputs.app }}
          ZIP: ${{ steps.sign.outputs.zip }}
          DMG: ${{ steps.sign.outputs.dmg }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          umask 077
          key="$RUNNER_TEMP/vestra-notary.p8"
          # The base64 of the .p8 file; its PEM text as is works too.
          if grep -q -- '-----BEGIN' <<< "$APPLE_API_KEY_P8_BASE64"; then
            printf '%s\n' "$APPLE_API_KEY_P8_BASE64" > "$key"
          else
            printf '%s' "$APPLE_API_KEY_P8_BASE64" | tr -d ' \r\n' | base64 --decode > "$key"
          fi
          grep -q -- '-----BEGIN PRIVATE KEY-----' "$key" \
            || { echo "::error::APPLE_API_KEY_P8_BASE64 is not a .p8 private key"; exit 1; }
          auth=(--key "$key" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID")
          notarize() {
            local result id status
            echo "notarytool submit $(basename "$1")"
            result=$(xcrun notarytool submit "$1" "${auth[@]}" --wait --timeout 30m --output-format json) || true
            id=$(jq -r '.id // empty' <<< "$result")
            status=$(jq -r '.status // empty' <<< "$result")
            echo "submission ${id:-?}: ${status:-?}"
            if [ -n "$id" ]; then
              xcrun notarytool log "$id" "${auth[@]}" || true
            fi
            [ "$status" = Accepted ] || { echo "::error::notarization of $(basename "$1"): ${status:-no result}"; return 1; }
          }
          staple() {
            local try
            for try in 1 2 3 4 5; do
              xcrun stapler staple "$1" && return 0
              [ "$try" != 5 ] || return 1
              echo "::warning::stapler staple failed (try $try), again in 15 s"
              sleep 15
            done
          }
          # The DMG's signature (no Hardened Runtime: not code), retried like
          # the app's on a timestamp server error.
          sign_dmg() {
            local try output
            for try in 1 2 3 4; do
              if output=$(codesign --force --sign "$IDENTITY" --keychain "$KEYCHAIN" --timestamp "$1" 2>&1); then
                [ -z "$output" ] || echo "$output"
                return 0
              fi
              echo "$output"
              grep -qi 'timestamp' <<< "$output" && [ "$try" != 4 ] || return 1
              echo "::warning::timestamp server error (try $try), again in 15 s"
              sleep 15
            done
          }
          out="$RUNNER_TEMP/signed"
          rm -rf "$out" && mkdir -p "$out"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$RUNNER_TEMP/notarize-app.zip"
          notarize "$RUNNER_TEMP/notarize-app.zip"
          staple "$APP"
          xcrun stapler validate "$APP"
          # The released .app.zip: the stapled app.
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$out/$ZIP"
          # The DMG as bundle-macos.mjs makes it: the app and an
          # Applications link, ULMO, HFS+. hdiutil sometimes reports the
          # device busy on CI runners: three tries.
          stage="$RUNNER_TEMP/dmg-stage"
          rm -rf "$stage" && mkdir -p "$stage"
          name=$(basename "$APP" .app)
          ditto "$APP" "$stage/$name.app"
          ln -s /Applications "$stage/Applications"
          for try in 1 2 3; do
            hdiutil create -volname "$name" -srcfolder "$stage" -format ULMO -fs HFS+ -ov "$out/$DMG" && break
            [ "$try" = 3 ] && exit 1
            sleep 10
          done
          sign_dmg "$out/$DMG"
          notarize "$out/$DMG"
          staple "$out/$DMG"
          ls -l "$out"
      # What a user's Mac checks: the files as uploaded, unpacked fresh.
      - name: Verify (codesign, spctl, stapler)
        if: steps.secrets.outputs.signed == 'true'
        env:
          ZIP: ${{ steps.sign.outputs.zip }}
          DMG: ${{ steps.sign.outputs.dmg }}
        run: |
          out="$RUNNER_TEMP/signed"
          check="$RUNNER_TEMP/check"
          rm -rf "$check" && mkdir -p "$check/zip"
          # spctl must say the source is a notarized Developer ID. Should the
          # runner image have Gatekeeper assessments off, spctl reports an
          # override instead: then only codesign and stapler can decide.
          notarized() {
            local result
            result=$(spctl "$@" 2>&1) || { echo "$result"; return 1; }
            echo "$result"
            if grep -q 'override=security disabled' <<< "$result"; then
              echo "::warning::Gatekeeper assessments are off on this runner; spctl cannot confirm the notarization (stapler validate does)"
              return 0
            fi
            grep -q 'source=Notarized Developer ID' <<< "$result"
          }
          codesign --verify --verbose=2 "$out/$DMG"
          notarized -a -vvv -t open --context context:primary-signature "$out/$DMG"
          xcrun stapler validate "$out/$DMG"
          mount="$check/mount"
          mkdir -p "$mount"
          hdiutil attach -nobrowse -readonly -mountpoint "$mount" "$out/$DMG" > /dev/null
          app=$(ls -d "$mount"/*.app)
          status=0
          codesign --verify --deep --strict --verbose=2 "$app" || status=1
          notarized -a -vvv -t exec "$app" || status=1
          xcrun stapler validate "$app" || status=1
          hdiutil detach "$mount" > /dev/null
          [ "$status" = 0 ] || { echo "::error::the app in the DMG does not verify"; exit 1; }
          ditto -x -k "$out/$ZIP" "$check/zip"
          app=$(ls -d "$check/zip"/*.app)
          codesign --verify --deep --strict --verbose=2 "$app"
          notarized -a -vvv -t exec "$app"
          xcrun stapler validate "$app"
      # The macOS host.json entry, for the signed binary: a later release
      # that reuses this host checks the binary in this .app.zip against it.
      - name: host.json entry of the signed host
        if: steps.secrets.outputs.signed == 'true'
        env:
          ZIP: ${{ steps.sign.outputs.zip }}
        run: |
          record="$RUNNER_TEMP/host-record/host-macos.json"
          binary=$(jq -er '.["macos-arm64"].binary' "$record")
          jq -e --arg zip "$ZIP" '.["macos-arm64"].archive == $zip' "$record" > /dev/null \
            || { echo "::error::host.json entry names another archive than $ZIP"; exit 1; }
          sum=$(unzip -p "$RUNNER_TEMP/signed/$ZIP" "$binary" | shasum -a 256 | cut -d ' ' -f 1)
          [[ "$sum" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::cannot read $binary from $ZIP"; exit 1; }
          mkdir -p "$RUNNER_TEMP/host-record-signed"
          jq --arg sum "$sum" '.["macos-arm64"].binarySha256 = $sum' "$record" \
            > "$RUNNER_TEMP/host-record-signed/host-macos.json"
          cat "$RUNNER_TEMP/host-record-signed/host-macos.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.secrets.outputs.signed == 'true'
        with:
          name: vestra-signed-macos
          path: ${{ runner.temp }}/signed
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.secrets.outputs.signed == 'true'
        with:
          name: host-vestra-signed-macos
          path: ${{ runner.temp }}/host-record-signed
          retention-days: 1
          if-no-files-found: error
      - name: Delete the keychain and the key files
        if: always()
        env:
          KEYCHAIN: ${{ steps.keychain.outputs.path }}
        run: |
          if [ -n "$KEYCHAIN" ] && [ -f "$KEYCHAIN" ]; then
            security delete-keychain "$KEYCHAIN" || true
          fi
          rm -f "$RUNNER_TEMP/vestra-signing.p12" "$RUNNER_TEMP/vestra-notary.p8"

  # The signed app runs: the package job's smoke test, again on the files
  # sign-macos made (Hardened Runtime and entitlements change what may run:
  # node's JIT, loading the Frameworks/ dylibs). No secrets, no environment.
  smoke-macos-signed:
    name: smoke test (signed macOS)
    needs: sign-macos
    if: ${{ !cancelled() && needs.sign-macos.result == 'success' && needs.sign-macos.outputs.signed == 'true' }}
    runs-on: macos-15
    # The host runs 15 s (smoke.mjs kills it 60 s later).
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: src/packaging
      # smoke.mjs uses Node built-ins only: no npm ci.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vestra-signed-macos
          path: ${{ runner.temp }}/signed
      - name: Smoke test (the signed DMG's app)
        timeout-minutes: 10
        run: |
          dmg=$(ls "$RUNNER_TEMP"/signed/*.dmg)
          mount=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$mount" "$dmg"
          ditto "$mount/Vestra Player.app" "$RUNNER_TEMP/smoke/Vestra Player.app"
          hdiutil detach "$mount"
          app="$RUNNER_TEMP/smoke/Vestra Player.app"
          codesign --verify --deep --strict "$app"
          node src/packaging/smoke.mjs --exe "$app/Contents/MacOS/vestra-host" \
            --plugins "$app/Contents/Resources/plugins"

  # TODO(S7 signing): Windows stays unsigned for now; SignPath comes later
  # (vestra-host.exe, libmpv-2.dll, ffmpeg/*, node.exe, then iscc with
  # SignTool= for setup.exe and the uninstaller; signtool verify /pa). The
  # Windows packages go to the release as packaged (vestra-unsigned-windows).
  sign-windows:
    name: sign Windows (TODO, unsigned)
    needs: package-windows
    if: ${{ !cancelled() && !inputs.dry_run && needs.package-windows.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
    steps:
      - run: echo "TODO(S7) Windows signing; the artifact stays unsigned."

  draft-release:
    name: draft GitHub release
    needs: [verify, checksums, sign-macos, smoke-macos-signed, sign-windows]
    if: >-
      ${{ !cancelled() && !inputs.dry_run && github.ref_type == 'tag'
      && needs.verify.result == 'success' && needs.checksums.result == 'success'
      && needs.sign-macos.result == 'success' && needs.sign-macos.outputs.signed == 'true'
      && needs.smoke-macos-signed.result == 'success' && needs.sign-windows.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            doc/releases
            .github/scripts
            src/packaging/windows
      # By name: a missing one fails here. macOS signed and notarized,
      # Windows unsigned, SHA256SUMS and host.json from checksums.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vestra-signed-macos
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vestra-unsigned-windows
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vestra-checksums
          path: dist
      - name: gh release create --draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.verify.outputs.version }}
        # The fixed-name copies are made here, from the files that are
        # uploaded (macOS signed; Windows once sign-windows signs), and checked with the
        # rest: releases/latest/download/<fixed name> serves them. Then
        # latest.json describes them (releases/latest/download/latest.json;
        # not in SHA256SUMS, see doc/releases/README.md) and is checked
        # before upload: parses, version is the tag's, files match.
        run: |
          bash .github/scripts/stable-names.sh dist "$VERSION"
          (cd dist && sha256sum -c SHA256SUMS)
          for f in VestraPlayer-windows-x64-setup.exe VestraPlayer-macos-arm64.dmg; do
            test -f "dist/$f" || { echo "::error::dist/$f is missing"; exit 1; }
          done
          bash .github/scripts/latest-json.sh write dist "$VERSION" "$GH_REPO"
          bash .github/scripts/latest-json.sh check dist "$VERSION" "$GH_REPO"
          jq -e '.downloads["windows-x64"] and .downloads["macos-arm64"]' dist/latest.json > /dev/null \
            || { echo "::error::latest.json must list windows-x64 and macos-arm64"; exit 1; }
          jq -e '.hosts["windows-x64"] and .hosts["macos-arm64"]' dist/host.json > /dev/null \
            || { echo "::error::host.json must list windows-x64 and macos-arm64"; exit 1; }
          gh release create "$TAG" --draft --verify-tag \
            --title "Vestra Player $VERSION" \
            --notes-file "doc/releases/v$VERSION.md" dist/*
