# Tag v* (or a manual dry run): the same checks as CI without caches, release
# builds, then a draft GitHub release. Signing and notarization are S7 TODOs.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and check only; no signing, no draft release.
        type: boolean
        default: true

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: tag matches version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' src/host/Cargo.toml | head -1)
          echo "src/host/Cargo.toml version: $version"
          if [ "$REF_TYPE" = tag ] && [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG does not match src/host/Cargo.toml version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  static:
    needs: verify
    permissions:
      contents: read
    uses: ./.github/workflows/_static.yml

  windows:
    needs: static
    permissions:
      contents: read
    uses: ./.github/workflows/_build-test.yml
    with:
      os: windows
      doc: true
      cache: false

  macos:
    needs: static
    permissions:
      contents: read
    uses: ./.github/workflows/_build-test.yml
    with:
      os: macos
      cache: false

  package-windows:
    needs: windows
    permissions:
      contents: read
    uses: ./.github/workflows/_package.yml
    with:
      os: windows

  package-macos:
    needs: macos
    permissions:
      contents: read
    uses: ./.github/workflows/_package.yml
    with:
      os: macos

  # TODO(S7): sign + notarize the macOS bundle on Ubuntu with rcodesign
  # (ci-research §10.2); secrets live only in the `release` environment
  # (tag-only deployments, required reviewer).
  sign-macos:
    name: sign macOS (TODO)
    needs: package-macos
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
    steps:
      - run: echo "TODO(S7) macOS signing and notarization; the artifact stays unsigned."

  # TODO(S7): Azure Artifact Signing with OIDC (id-token: write) + signtool verify.
  sign-windows:
    name: sign Windows (TODO)
    needs: package-windows
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
    steps:
      - run: echo "TODO(S7) Windows signing; the artifact stays unsigned."

  draft-release:
    name: draft GitHub release
    needs: [verify, sign-macos, sign-windows]
    if: ${{ !inputs.dry_run && github.ref_type == 'tag' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: vestra-unsigned-*
          path: dist
      - name: Archive and checksum
        working-directory: dist
        run: |
          for d in vestra-unsigned-*; do (cd "$d" && zip -qr "../$d.zip" .); done
          sha256sum ./*.zip > SHA256SUMS
          cat SHA256SUMS
      - name: gh release create --draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --draft --verify-tag --title "Vestra Player $TAG" \
            --notes "Unsigned build (signing: S7)." dist/*.zip dist/SHA256SUMS
